name: Build debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f StudySaathi.zip ]; then
            mkdir -p /tmp/p
            unzip -q -o StudySaathi.zip -d /tmp/p
            echo "APPDIR=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
          else
            echo "APPDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ${{ env.APPDIR }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        working-directory: ${{ env.APPDIR }}
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StudySaathi-debug-apk
          path: ${{ env.APPDIR }}/app/build/outputs/apk/debug/app-debug.apk
